fixed_base_workspace:
  ros__parameters:
    base_frame: base_link
    tcp_frame: openarm_left_hand_tcp
    arm_group: left_arm
    full_group: left_arm_with_torso

    # Deterministic coarse cell-centre mapping. Increase only after reviewing runtime.
    grid_x: 7
    grid_y: 7
    grid_z: 7
    max_ik_seeds: 42
    ik_timeout_s: 0.015
    orientation_tolerance_rad: 0.03
    exact_bound_epsilon: 1.0e-8

    # KINEMATIC_REFERENCE_GRASP_50MM, quaternion order x,y,z,w.
    target_qx: 0.0
    target_qy: 1.0
    target_qz: 0.0
    target_qw: 0.0
    orientation_source: validation/reference_grasp_50mm.yaml

    lift_candidate_count: 7
    yaw_candidate_count: 3
    pitch_candidate_count: 4

    max_grid_points: 8000
    max_ik_seeds_hard: 50
    max_torso_candidates: 256
    max_configuration_evaluations: 16000
    max_total_ik_attempts: 400000
    max_experiment_wall_time_s: 1800.0
    progress_every: 10
