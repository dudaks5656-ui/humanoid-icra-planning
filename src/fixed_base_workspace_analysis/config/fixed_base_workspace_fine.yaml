fixed_base_workspace_fine:
  ros__parameters:
    base_frame: base_link
    tcp_frame: openarm_left_hand_tcp
    arm_group: left_arm
    full_group: left_arm_with_torso

    # Forward/high-Z region derived from and checked against the immutable coarse CSV.
    target_x_min: 0.40
    target_x_max: 0.75
    target_y_min: 0.00
    target_y_max: 0.42
    target_z_min: 0.60
    target_z_max: 1.75
    grid_x: 12
    grid_y: 10
    grid_z: 12

    max_ik_seeds: 150
    special_validation_ik_seeds: 300
    required_valid_solutions: 2
    special_required_valid_solutions: 3
    ik_timeout_s: 0.008
    orientation_tolerance_rad: 0.03
    exact_bound_epsilon: 1.0e-8
    random_seed: 20260818

    # KINEMATIC_REFERENCE_GRASP_50MM, quaternion order x,y,z,w.
    target_qx: 0.0
    target_qy: 1.0
    target_qz: 0.0
    target_qw: 0.0
    orientation_source: validation/reference_grasp_50mm.yaml

    # Retained because the shared RobotModel loader validates the same coarse contract.
    lift_candidate_count: 7
    yaw_candidate_count: 3
    pitch_candidate_count: 4

    max_grid_points: 3000
    max_ik_seeds_hard: 150
    max_special_ik_seeds_hard: 300
    max_torso_candidates: 100
    max_configuration_evaluations: 6000
    max_total_ik_attempts: 650000
    max_experiment_wall_time_s: 7200.0
    progress_every: 25
    high_z_min: 1.35
