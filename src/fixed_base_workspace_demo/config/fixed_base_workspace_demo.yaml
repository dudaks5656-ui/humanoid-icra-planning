fixed_base_workspace_demo:
  ros__parameters:
    base_frame: base_link
    tcp_frame: openarm_left_hand_tcp
    arm_group: left_arm
    full_group: left_arm_with_torso

    # KINEMATIC_REFERENCE_GRASP_50MM, quaternion x,y,z,w.
    target_qx: 0.0
    target_qy: 1.0
    target_qz: 0.0
    target_qw: 0.0
    orientation_tolerance_rad: 0.03
    exact_bound_epsilon: 1.0e-8
    representative_ik_seeds: 300
    representative_required_valid_solutions: 3
    ik_timeout_s: 0.01
    random_seed: 20260818

    marker_diameter: 0.021
    marker_publish_hz: 10.0
    startup_delay_s: 6.0
    robot_scene_s: 5.0
    c0_scene_s: 7.0
    c1_scene_s: 7.0
    c2_scene_s: 7.0
    c3_scene_s: 9.0
    failed_config_scene_s: 2.5
    combined_reachable_scene_s: 4.0
    animation_scene_s: 8.0
    final_scene_s: 3.0
    duration_scale: 1.0
    demo_scene: auto
    preflight_only: false
    # The 2D companion overlay is used for presentation text because the
    # high-DPI RViz/OGRE font path distorts TEXT_VIEW_FACING glyph widths.
    world_text_enabled: false
    animation_samples: 101

    # Safety contract: these remain false and are audited at runtime.
    trajectory_execution: false
    controller_enabled: false
    ros2_control_enabled: false
    hardware_enabled: false
    amr_motion_enabled: false
