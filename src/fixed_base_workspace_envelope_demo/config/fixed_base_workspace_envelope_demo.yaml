fixed_base_workspace_envelope_demo:
  ros__parameters:
    base_frame: base_link
    tcp_frame: openarm_left_hand_tcp
    arm_group: left_arm

    # KINEMATIC_REFERENCE_GRASP_50MM orientation, quaternion x,y,z,w.
    target_qx: 0.0
    target_qy: 1.0
    target_qz: 0.0
    target_qw: 0.0
    orientation_tolerance_rad: 0.03

    marker_publish_hz: 10.0
    point_diameter: 0.016
    surface_alpha: 0.35
    voxel_alpha: 0.22
    startup_delay_s: 6.0
    robot_scene_s: 4.0
    c0_scene_s: 8.0
    c1_scene_s: 8.0
    c2_scene_s: 8.0
    c3_scene_s: 9.0
    c0_vs_c3_scene_s: 9.0
    combined_only_scene_s: 10.0
    final_scene_s: 3.0
    animation_samples: 101

    demo_scene: auto
    visualization_mode: surface
    duration_scale: 1.0
    preflight_only: false

    # Immutable safety contract.
    trajectory_execution: false
    controller_enabled: false
    ros2_control_enabled: false
    hardware_enabled: false
    amr_motion_enabled: false
