integration_rules:
  lift_link_ownership:
    - Fixed Lift rails and columns belong on the AMR-side link.
    - Only the moving carriage and moving top plate belong on lift_link.

  units:
    - ROS geometry and transforms use metres.
    - If STL files are exported in millimetres, the URDF/Xacro mesh element
      must explicitly use the appropriate scale to convert millimetres to metres.
    - The scale must be verified from the received CAD export; do not assume it.

  freeze_until_received:
    - Do not change current joint limits, axes, origins, arm mounts, or primitives.
    - Do not compensate for the AMR-Lift intersection with guessed coordinates or sizes.
    - Do not apply CAD frames or mesh paths to Xacro, URDF, or existing config
      until all required CAD/UCS data is received and reviewed.
