protocol: LIFT_ACTUATED_EXTRACTION_BASELINE_V1
scope: GRASP_THROUGH_LIFT_CLEARANCE_ONLY
planning_only: true
trajectory_execution_performed: false
grasp_lift_candidates_m: [0.35, 0.40]
fixed_torso:
  yaw_rad: 0.0
  pitch_rad: 0.0
grasp_search:
  deterministic_ik_seeds: 100
  duplicate_joint_distance_rad: 0.0001
  # Zero means validate every retained collision-free, positive-margin branch.
  maximum_candidates_to_validate: 0
lift_motion:
  coordinate_convention: Q_ZERO_TOP_INCREASING_WORLD_NEGATIVE_Z
  required_urdf_bounds_m: [0.0, 0.7]
  maximum_sample_spacing_m: 0.001
  object_bottom_clearance_above_box_top_m: 0.020
  descent_direction: INCREASING_Q
  ascent_direction: DECREASING_Q
strict_arm_locked:
  arm_lock_tolerance_rad: 1.0e-12
  tcp_xy_tolerance_m: 1.0e-8
  tcp_z_translation_tolerance_m: 1.0e-8
  tcp_orientation_tolerance_rad: 1.0e-8
micro_arm_compensation:
  enabled: false
  performed: false
immutable_inputs:
  box_internal_dimensions_m: [0.600, 0.400, 0.150]
  target_dimensions_m: [0.050, 0.050, 0.050]
  grasp_orientation: KINEMATIC_REFERENCE_GRASP_50MM_FIXED_TOP_ORIENTATION
  q_contact_source: top_open_reference_scene.yaml
failure_labels:
  - GRASP_CONFIGURATION_IK_FAILURE
  - LIFT_DESCENT_LIMIT_FAILURE
  - LIFT_DESCENT_COLLISION_FAILURE
  - GRASP_GEOMETRY_FAILURE
  - LIFT_ASCENT_LIMIT_FAILURE
  - LIFT_ASCENT_COLLISION_FAILURE
  - ATTACHED_OBJECT_CLEARANCE_FAILURE
  - ARM_COMPENSATION_CONNECTIVITY_FAILURE
  - LIFT_ACTUATED_EXTRACTION_SUCCESS
