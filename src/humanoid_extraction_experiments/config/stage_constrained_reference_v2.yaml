protocol: STAGE_CONSTRAINED_REFERENCE_V2
status: LOCAL_VALIDATION_REQUIRED
planning_only: true
trajectory_execution_performed: false
immutable_inputs:
  yaw_rad: 0.0
  pitch_rad: 0.0
  lift_candidates_m: [0.35, 0.40]
  cartesian_spacing_candidates_m: [0.005, 0.0025, 0.001]
  sequential_ik_fallback_seeds: 32
  required_dense_valid_candidates: 5
stages:
  - {name: TOP_APPROACH, method: OMPL_RRTConnect}
  - {name: VERTICAL_DESCENT, method: DETERMINISTIC_MULTISTART_SEQUENTIAL_IK}
  - {name: GRASP, method: FINGER_ONLY_10_STEP_TASK_SCOPED_TOUCH}
  - {name: LIFT_CLEAR, method: DETERMINISTIC_MULTISTART_SEQUENTIAL_IK, object_attached: true}
  - {name: TRANSFER_OUTSIDE, method: OMPL_RRTConnect, object_attached: true}
dense_validation:
  max_revolute_step_rad: 0.01
  max_prismatic_step_m: 0.005
  exact_joint_bounds_required: true
  collision_free_required: true
  yaw_pitch_lock_tolerance_rad: 0.000001
selection_order:
  - maximize_min_active_revolute_margin
  - maximize_min_environment_clearance
  - maximize_min_self_clearance
  - minimize_planning_time
