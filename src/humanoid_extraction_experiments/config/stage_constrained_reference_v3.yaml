protocol: STAGE_CONSTRAINED_REFERENCE_V3
status: LOCAL_VALIDATION_REQUIRED
planning_only: true
trajectory_execution_performed: false
immutable_inputs:
  yaw_rad: 0.0
  pitch_rad: 0.0
  lift_candidates_m: [0.35, 0.40]
  cartesian_spacing_m: 0.001
layered_ik_graph:
  deterministic_random_seeds_per_waypoint: 100
  continuation_seeds: ALL_RETAINED_PREVIOUS_LAYER_CANDIDATES
  max_retained_candidates_per_waypoint: 48
  retention_priority: REACHABLE_PREDECESSOR_CONTINUATION_THEN_MARGIN
  edge_expansion: REACHABLE_PREDECESSOR_FRONTIER_ONLY
  duplicate_joint_distance_rad: 0.0001
  max_edge_revolute_step_rad: 0.12
  max_edge_prismatic_step_m: 0.005
  dense_edge_revolute_resolution_rad: 0.01
  dense_edge_prismatic_resolution_m: 0.005
  edge_cost:
    joint_displacement_weight: 1.0
    joint_limit_proximity_weight: 0.002
  exact_joint_bounds_required: true
  self_collision_free_required: true
  environment_collision_free_required: true
failure_labels:
  - NO_IK_SOLUTION_AT_WAYPOINT
  - NO_COLLISION_FREE_IK_AT_WAYPOINT
  - IK_BRANCH_CONNECTIVITY_GAP
  - GRAPH_PATH_FOUND
notes:
  - Boundary-audit mode targets only 78->79 at Lift 0.35 and 28->29 at Lift 0.40 with cap and deduplication disabled at the target layer.
  - stage_v3_layers.csv records raw IK, collision-free IK, retained nodes, valid edges, and reachable nodes per waypoint.
  - A graph path is evidence about reverse Cartesian IK only, not a complete five-stage trajectory.
  - Fixed orientation is never relaxed by this implementation.
  - Candidate and edge caps are explicit, so a failed sampled graph does not prove global structural impossibility.
