radial_workspace_validation:
  ros__parameters:
    base_frame: base_link
    tcp_frame: openarm_left_hand_tcp
    arm_group: left_arm
    full_group: left_arm_with_torso

    # Parameters retained by the shared validated RobotModel/IK implementation.
    grid_x: 1
